# =============================================================
# LocalStack Pro — simula S3, Glue, Athena e RDS PostgreSQL.
#
# Uso:
#   export LOCALSTACK_AUTH_TOKEN=xxxxx
#   docker compose -f localstack/docker-compose.yml up -d
# =============================================================

services:

  localstack:
    image: localstack/localstack-pro:latest
    container_name: localstack-dw
    ports:
      - "4566:4566"     # Edge - todas as APIs AWS (S3, Glue, Athena...)
      - "4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN before starting LocalStack Pro}
      - SERVICES=s3,glue,athena,rds,iam,sts,logs
      - DEBUG=0
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_DOCKER_NETWORK=dw-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init:/etc/localstack/init/ready.d"
      - "./glue_jobs:/opt/glue_jobs"
    networks:
      - dw-network

# Rede usada pelos jobs Glue executados pelo LocalStack.
networks:
  dw-network:
    name: dw-network
    driver: bridge
