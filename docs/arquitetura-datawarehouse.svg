  <path d="M384 819H492" class="flow"/>
  <text x="438" y="801" text-anchor="middle" class="small">JDBC</text>
  <path d="M792 819H896" class="flow"/>
  <text x="844" y="801" text-anchor="middle" class="small">grava</text>

  <rect x="1360" y="746" width="260" height="160" rx="16" fill="#183d36"/>
