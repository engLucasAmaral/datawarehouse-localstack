  <path d="M660 350H786" class="flow"/>
  <rect x="671" y="321" width="104" height="23" rx="11" fill="#f2f6f2"/>
  <text x="723" y="337" text-anchor="middle" class="small">upload CSV</text>
  <path d="M786 433H660" class="flow"/>
  <rect x="672" y="441" width="104" height="22" rx="11" fill="#f2f6f2"/>
  <text x="724" y="456" text-anchor="middle" class="small">leitura Spark</text>

