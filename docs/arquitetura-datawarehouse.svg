  <rect x="94" y="730" width="290" height="178" rx="15" class="card"/>
  <rect x="94" y="730" width="7" height="178" rx="3.5" fill="#d66a58"/>
  <text x="121" y="770" class="label" fill="#a8473c">LEITURA JDBC</text>
  <text x="121" y="808" class="card-title">Tabela de origem</text>
  <text x="121" y="839" class="card-copy">public.netflix_titles</text>
  <text x="121" y="875" class="small">Uma linha por título</text>

  <rect x="492" y="730" width="300" height="178" rx="15" class="card"/>
  <rect x="492" y="730" width="300" height="8" rx="4" fill="#319273"/>
  <rect x="516" y="754" width="35" height="35" rx="10" fill="#e2f1e9"/>
  <path d="M526 772h15M533.5 764.5v15" stroke="#287659" stroke-width="2.3" stroke-linecap="round"/>
  <text x="563" y="777" class="label" fill="#287659">GLUE JOB 02</text>
  <text x="516" y="825" class="card-title">etl-netflix-dw</text>
  <text x="516" y="854" class="card-copy">PySpark · dimensionalização</text>
  <text x="516" y="883" class="small">Gera dimensões, fato e bridges</text>

  <rect x="896" y="710" width="365" height="220" rx="15" class="card"/>
