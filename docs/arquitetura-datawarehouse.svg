  <text x="826" y="389" class="small">netflix-movies-and-series/</text>
  <rect x="808" y="415" width="234" height="57" rx="10" fill="#f1f7f8"/>
  <rect x="808" y="415" width="4" height="57" rx="2" fill="#3c91a0"/>
  <text x="826" y="440" class="label" fill="#277682">REFINED  /  PARQUET</text>
  <text x="826" y="460" class="small">netflix_titles/</text>

  <rect x="1185" y="280" width="390" height="206" rx="15" class="card"/>
  <rect x="1185" y="280" width="390" height="8" rx="4" fill="#d66a58"/>
  <circle cx="1220" cy="321" r="15" fill="#fbe9e5"/>
