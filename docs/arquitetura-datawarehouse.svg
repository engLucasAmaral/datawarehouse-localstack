  <rect x="839" y="525" width="178" height="23" rx="11" fill="#fbfdfb"/>
  <text x="928" y="541" text-anchor="middle" class="small">JDBC · netflix_titles</text>

  <text x="64" y="633" class="phase">02  /  MODELO DIMENSIONAL E CONSUMO</text>
  <path d="M497 628H1615" class="section-line"/>

