<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Data Warehouse Netflix</title>
  <desc id="desc">Fluxo de ingestão do Kaggle para S3 e PostgreSQL, transformação dimensional com Glue e consumo em ferramentas de BI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#47766b"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dfe7e1" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Aptos", "Segoe UI", sans-serif; fill: #18342e; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.8px; fill: #47766b; }
      .title { font-size: 39px; font-weight: 750; }
      .subtitle { font-size: 18px; fill: #60766f; }
      .phase { font-size: 15px; font-weight: 750; letter-spacing: 1.3px; fill: #47766b; }
      .section-line { stroke: #c9d6ce; stroke-width: 1.5; }
      .panel { fill: #fbfdfb; stroke: #b6c9be; stroke-width: 2; }
      .panel-label { font-size: 14px; font-weight: 750; letter-spacing: 1.4px; fill: #42695f; }
      .card { fill: #ffffff; stroke: #d3dfd8; stroke-width: 1.5; }
      .card-title { font-size: 21px; font-weight: 730; }
      .card-copy { font-size: 15px; fill: #60766f; }
      .small { font-size: 13px; fill: #60766f; }
      .label { font-size: 12px; font-weight: 750; letter-spacing: .7px; }
      .flow { fill: none; stroke: #47766b; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #78968b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1680" height="1080" fill="#f2f6f2"/>
  <rect width="1680" height="1080" fill="url(#grid)" opacity=".46"/>
  <rect x="0" y="0" width="1680" height="160" fill="#f8faf8"/>
  <path d="M0 159H1680" stroke="#d8e2db" stroke-width="2"/>

  <text x="64" y="53" class="eyebrow">DATA PLATFORM  /  LOCAL DEVELOPMENT</text>
  <text x="64" y="105" class="title">Netflix Data Warehouse</text>
  <text x="66" y="137" class="subtitle">Ingestão em lote, modelo dimensional e camada pronta para análise</text>
  <rect x="1390" y="49" width="222" height="38" rx="19" fill="#e2efe8"/>
  <circle cx="1413" cy="68" r="5" fill="#328566"/>
  <text x="1428" y="73" class="label" fill="#28654f">AMBIENTE LOCAL · PRO</text>

  <text x="64" y="204" class="phase">01  /  INGESTÃO E CAMADA OPERACIONAL</text>
  <path d="M460 199H1615" class="section-line"/>

